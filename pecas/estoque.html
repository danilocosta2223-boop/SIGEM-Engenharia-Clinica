<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SIGEM Enterprise | Centro de Comando</title>
    <style>
        :root { --primary: #0f172a; --accent: #0284c7; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .full { grid-column: span 3; }
        label { display: block; font-weight: 700; font-size: 0.75rem; color: #475569; text-transform: uppercase; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .info-box { background: #e0f2fe; padding: 10px; border-radius: 6px; font-size: 0.85rem; color: #0369a1; border-left: 4px solid #0284c7; }
        .btn-submit { background: var(--accent); color: white; padding: 18px; border: none; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>SIGEM Enterprise</h1>
        <div style="text-align: right;">
            <label>Protocolo</label>
            <div id="protocolo" style="font-weight: bold; color: #0284c7;">SIGEM-20260817-0001</div>
        </div>
    </div>

    <form id="sigemForm">
        <div class="grid">
            <!-- Identificação -->
            <div><label>Técnico</label><input type="text" required></div>
            <div><label>Matrícula</label><input type="text" required></div>
            <div><label>OS</label><input type="text" placeholder="OS-XXXX" required></div>

            <!-- Dados do Ativo -->
            <div><label>Patrimônio</label><input type="text" id="patrimonio" placeholder="Buscar 90506731291" required></div>
            <div><label>Equipamento (Auto)</label><input type="text" id="equipamento" readonly placeholder="Auto-preenchido"></div>
            <div><label>Setor / Unidade (Auto)</label><input type="text" id="setor" readonly placeholder="Auto-preenchido"></div>

            <!-- Dados da Peça -->
            <div><label>Peça</label>
                <select id="peca" onchange="atualizarDadosPeca()">
                    <option value="">Selecione...</option>
                    <option value="SPO2">Sensor SPO2</option>
                    <option value="ECG">Cabo ECG</option>
                </select>
            </div>
            <div><label>Quantidade</label><input type="number" value="1"></div>
            <div><label>Localização Física</label><div class="info-box" id="localizacao">Selecione uma peça</div></div>

            <!-- Fluxo de Trabalho -->
            <div><label>Motivo</label>
                <select>
                    <option>Corretiva</option><option>Preventiva</option><option>Calibração</option>
                    <option>Instalação</option><option>Emergência</option>
                </select>
            </div>
            <div><label>Situação</label><select id="situacao"><option>Retirado</option><option>Em Uso</option></select></div>
            <div><label>Foto (Itens Críticos)</label><input type="file"></div>

            <div class="full"><label>Defeito Encontrado</label><textarea rows="2"></textarea></div>
            <div class="full"><label>Resultado Final</label>
                <select>
                    <option>Equipamento liberado</option>
                    <option>Aguardando peça</option>
                    <option>Equipamento condenado</option>
                </select>
            </div>
            
            <div class="full"><label><input type="checkbox" required> Declaro responsabilidade pela movimentação de patrimônio público.</label></div>
        </div>
        <button type="submit" class="btn-submit">CONFIRMAR E GERAR LOG DE AUDITORIA</button>
    </form>
</div>

<script>
    // 1. Data e Hora Automáticas
    const agora = new Date();
    console.log("Data:", agora.toLocaleDateString(), "Hora:", agora.toLocaleTimeString());

    // 2. Simulação de Busca Automática (Integração Futura)
    document.getElementById('patrimonio').addEventListener('blur', function() {
        if(this.value === '90506731291') {
            document.getElementById('equipamento').value = "Monitor Multiparamétrico";
            document.getElementById('setor').value = "UTI Adulto - Bloco B";
        }
    });

    // 3. Atualização de Estoque/Localização (Lógica de Materiais.xlsx)
    function atualizarDadosPeca() {
        const local = document.getElementById('localizacao');
        local.innerHTML = "Saldo: 12 | Mín: 4 | <strong>Corredor A, Nível 02</strong>";
    }

    // 4. Submit e Auditoria
    document.getElementById('sigemForm').onsubmit = (e) => {
        e.preventDefault();
        alert("Movimentação registrada! Logs gerados em: baixas.xlsx, auditoria.xlsx e movimentacoes.json.");
    };
</script>
</body>
</html>
