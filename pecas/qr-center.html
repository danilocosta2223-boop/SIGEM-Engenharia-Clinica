<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { opacity: 0; transform: translateY(10px); transition: all 0.5s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased p-4">

    <div class="max-w-lg mx-auto space-y-8">
        
        <!-- Header -->
        <header class="text-center space-y-1 mt-4">
            <h1 class="text-3xl font-extrabold tracking-widest text-white">SIGEM QR</h1>
            <p class="text-cyan-400 text-[10px] uppercase tracking-[3px] font-medium">Controle Operacional de Ativos</p>
        </header>

        <!-- Ação Principal -->
        <section id="scanArea" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center shadow-xl">
            <div class="h-40 border-2 border-dashed border-slate-700 rounded-xl mb-4 flex items-center justify-center text-slate-500">
                <i class="fa-solid fa-qrcode text-5xl"></i>
            </div>
            <button onclick="realizarScan()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-cyan-900/20">
                <i class="fa-solid fa-camera mr-2"></i> ESCANEAR QR CODE
            </button>
        </section>

        <!-- Área de Dados (Escondida e com Animação) -->
        <div id="dadosEquipamento" class="fade-in hidden space-y-6">
            
            <!-- Card Principal -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <div class="flex items-center gap-4 mb-6">
                    <img src="imagens/equipamentos-medicos.jpg" class="w-20 h-20 rounded-lg object-cover border border-slate-700">
                    <div>
                        <h2 class="text-lg font-bold leading-tight">Analisador Hematológico</h2>
                        <span class="bg-cyan-500/20 text-cyan-300 px-3 py-1 rounded-lg font-bold text-xs inline-block mt-2">YUMI-0003</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center">
                        <p class="text-[9px] text-slate-500 uppercase font-bold">Setor</p>
                        <p class="text-xs font-semibold">Hematologia</p>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center">
                        <p class="text-[9px] text-slate-500 uppercase font-bold">Unidade</p>
                        <p class="text-xs font-semibold">Penha</p>
                    </div>
                </div>
            </div>

            <!-- Formulário -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <select class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-cyan-500 outline-none">
                    <option>Sensor ECG</option>
                    <option>Cabo ECG</option>
                </select>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" placeholder="Qtd" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm">
                    <input type="text" placeholder="Nº OS" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm">
                </div>
                <input type="text" value="Danilo Costa" readonly class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-slate-500">
                
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-center text-xs font-mono text-cyan-400">
                    SIGEM-20260818-0001
                </div>

                <button class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest text-sm transition-all">
                    Registrar Movimentação
                </button>
            </div>

            <!-- Última Movimentação -->
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <p class="text-[10px] text-cyan-400 uppercase font-bold mb-2">Última Movimentação</p>
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-300">
                    <p>Data: 18/08/2026</p>
                    <p>Peça: Sensor ECG</p>
                    <p>Qtd: 1</p>
                    <p>OS: OS-2026-001</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function realizarScan() {
            const el = document.getElementById("dadosEquipamento");
            el.classList.remove('hidden');
            setTimeout(() => { el.classList.add('visible'); }, 50);
        }
    </script>
</body>
</html>
